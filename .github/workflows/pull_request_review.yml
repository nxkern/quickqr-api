name: Run Tests on Pull Request


on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.27.3"

      - name: Run test
        run: |
          go install gotest.tools/gotestsum@latest
          make test

      - name: Build Project
        run: make
